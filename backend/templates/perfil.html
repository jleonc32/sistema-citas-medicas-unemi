{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white p-4">
                <h3 class="mb-0 fw-bold">Mi Perfil Personal</h3>
            </div>
            <div class="card-body p-4">
                <div class="row mb-4">
                    <div class="col-md-4 text-center">
                        <img src="https://ui-avatars.com/api/?name={{ usuario.nombre }}&background=0D6EFD&color=fff&size=150" class="rounded-circle shadow-sm" alt="Avatar">
                    </div>
                    <div class="col-md-8">
                        <h2 class="fw-bold">{{ usuario.nombre }}</h2>
                        <p class="text-muted"><i class="bi bi-envelope"></i> {{ usuario.email }}</p>
                        <span class="badge bg-success">Paciente Verificado</span>
                    </div>
                </div>

                <h5 class="fw-bold border-bottom pb-2 mb-3">Datos de Identificación</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="text-muted small">Número de Cédula</label>
                        <p class="fw-bold">{{ usuario.cedula }}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="text-muted small">Teléfono de Contacto</label>
                        <p class="fw-bold">{{ paciente.telefono or 'No registrado' }}</p>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="text-muted small">Dirección Domiciliaria</label>
                        <p class="fw-bold">{{ paciente.direccion or 'No registrada' }}</p>
                    </div>
                </div>

                <div class="mt-4">
                    <a href="/dashboard" class="btn btn-outline-primary">Regresar al Panel</a>
                    <button class="btn btn-primary" disabled>Editar Información (Próximamente)</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
