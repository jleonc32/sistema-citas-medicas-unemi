<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Citas Médicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">🏥 Clínica UNEMI</a>
            <div class="d-flex">
                {% if session.get('id_usuario') %}
                    <a href="/dashboard" class="btn btn-outline-light me-2">Mi Panel</a>
                    <a href="/logout" class="btn btn-danger">Cerrar Sesión</a>
                {% else %}
                    <a href="/login" class="btn btn-outline-light me-2">Ingresar</a>
                    <a href="/registro" class="btn btn-light text-primary">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
